# Rebuilds the generated files (products.js, products/*.html, sitemap.xml,
# placeholder images) and runs the test suite. Fails if the committed generated
# files are stale, so a products.json edit without `npm run build` never ships.
name: build-and-test

on:
  push:
    branches: [ main, arena/** ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build catalog artifacts
        run: npm run build

      - name: Generated files are up to date
        run: |
          if ! git diff --exit-code -- products.js products/ sitemap.xml; then
            echo "::error::Generated files are stale. Run 'npm run build' and commit the result."
            exit 1
          fi

      - name: Run tests
        run: |
          npm i --no-audit --no-fund jsdom
          npm test
